name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize state bootstrap
        working-directory: infra/bootstrap/state
        run: terraform init -backend=false

      - name: Validate state bootstrap
        working-directory: infra/bootstrap/state
        run: terraform validate

      - name: Initialize production without remote backend
        working-directory: infra/environments/production
        run: terraform init -backend=false

      - name: Validate production
        working-directory: infra/environments/production
        run: terraform validate

  production-compose:
    name: Production Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production configuration
        run: >-
          docker compose
          --env-file .env.production.example
          -f compose.prod.yaml
          config --quiet

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env PAYFLOW_DOMAIN=localhost
          --volume "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload front-end coverage
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  backend:
    name: Back-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload back-end coverage and bytecode
        uses: actions/upload-artifact@v5
        with:
          name: backend-analysis
          path: |
            backend/target/classes/
            backend/target/site/jacoco/jacoco.xml
          retention-days: 7

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.fork == false }}

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download front-end coverage
        uses: actions/download-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Download back-end analysis files
        uses: actions/download-artifact@v5
        with:
          name: backend-analysis
          path: backend/target

      - name: Validate SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "Configure the SONAR_TOKEN repository secret."; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "Configure the SONAR_HOST_URL repository variable."; exit 1; }

      - name: Analyze and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install front-end dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the complete application
        run: docker compose up --build --wait

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the application
        if: always()
        run: docker compose down --volumes
