name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve approved release candidate
        id: candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo 'Run releases only from the main branch.'
            exit 1
          }
          .github/scripts/resolve-release-candidate.sh "$VERSION" "$GITHUB_SHA"

      - name: Checkout approved release candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.candidate.outputs.release_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate release source and versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          root_version=$(node --print "require('./package.json').version")
          root_lock_version=$(node --print "require('./package-lock.json').packages[''].version")
          frontend_version=$(node --print "require('./frontend/package.json').version")
          frontend_lock_version=$(node --print "require('./frontend/package-lock.json').packages[''].version")
          backend_version=$(mvn --file backend/pom.xml --quiet --no-transfer-progress \
            help:evaluate -Dexpression=project.version -DforceStdout)

          for declared_version in \
            "$root_version" \
            "$root_lock_version" \
            "$frontend_version" \
            "$frontend_lock_version" \
            "$backend_version"; do
            test "$declared_version" = "$VERSION" || {
              echo "Expected version $VERSION, found $declared_version."
              exit 1
            }
          done

          test -f "docs/releases/v$VERSION.md" || {
            echo "Missing docs/releases/v$VERSION.md."
            exit 1
          }
          grep --fixed-strings --quiet "## [$VERSION]" CHANGELOG.md || {
            echo "Missing version $VERSION in CHANGELOG.md."
            exit 1
          }

      - name: Validate required checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.release_sha }}
        run: |
          set -euo pipefail

          validate_checks() {
            local revision=$1
            local label=$2
            shift 2
            local checks
            checks=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$revision/check-runs?per_page=100")

            for check_name in "$@"; do
              conclusion=$(jq --raw-output --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.completed_at)
                | last
                | .conclusion // "missing"
              ' <<< "$checks")
              test "$conclusion" = 'success' || {
                echo "Required check '$check_name' is '$conclusion' on $label $revision."
                exit 1
              }
            done
          }

          candidate_checks=(
            'Terraform'
            'Production Compose'
            'Front-end'
            'Back-end'
            'E2E'
          )
          main_checks=(
            "${candidate_checks[@]}"
            'SonarQube'
            'SonarCloud Code Analysis'
          )

          validate_checks "$RELEASE_SHA" 'release candidate' "${candidate_checks[@]}"
          validate_checks "$GITHUB_SHA" 'main commit' "${main_checks[@]}"

      - name: Validate tag and release availability
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.candidate.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA" || {
              echo "Tag $tag already points to another commit."
              exit 1
            }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
            exit 1
          fi

      - name: Create annotated tag when absent
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.candidate.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "$tag" "$RELEASE_SHA" --message "PayFlow $tag"
            git push origin "refs/tags/$tag"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v$VERSION"
          --verify-tag
          --title "PayFlow v$VERSION"
          --notes-file "docs/releases/v$VERSION.md"
