name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate release source and versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Version must use MAJOR.MINOR.PATCH without a v prefix.'
            exit 1
          }
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo 'Run releases only from the main branch.'
            exit 1
          }

          root_version=$(node --print "require('./package.json').version")
          root_lock_version=$(node --print "require('./package-lock.json').packages[''].version")
          frontend_version=$(node --print "require('./frontend/package.json').version")
          frontend_lock_version=$(node --print "require('./frontend/package-lock.json').packages[''].version")
          backend_version=$(mvn --file backend/pom.xml --quiet --no-transfer-progress \
            help:evaluate -Dexpression=project.version -DforceStdout)

          for declared_version in \
            "$root_version" \
            "$root_lock_version" \
            "$frontend_version" \
            "$frontend_lock_version" \
            "$backend_version"; do
            test "$declared_version" = "$VERSION" || {
              echo "Expected version $VERSION, found $declared_version."
              exit 1
            }
          done

          test -f "docs/releases/v$VERSION.md" || {
            echo "Missing docs/releases/v$VERSION.md."
            exit 1
          }
          grep --fixed-strings --quiet "## [$VERSION]" CHANGELOG.md || {
            echo "Missing version $VERSION in CHANGELOG.md."
            exit 1
          }

      - name: Validate required checks on main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checks=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")
          required_checks=(
            'Terraform'
            'Production Compose'
            'Front-end'
            'Back-end'
            'E2E'
            'SonarQube'
            'SonarCloud Code Analysis'
          )

          for check_name in "${required_checks[@]}"; do
            conclusion=$(jq --raw-output --arg name "$check_name" '
              [.check_runs[] | select(.name == $name)]
              | sort_by(.completed_at)
              | last
              | .conclusion // "missing"
            ' <<< "$checks")
            test "$conclusion" = 'success' || {
              echo "Required check '$check_name' is '$conclusion' on $GITHUB_SHA."
              exit 1
            }
          done

      - name: Validate tag and release availability
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" || {
              echo "Tag $tag already points to another commit."
              exit 1
            }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
            exit 1
          fi

      - name: Create annotated tag when absent
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "$tag" --message "PayFlow $tag"
            git push origin "refs/tags/$tag"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v$VERSION"
          --verify-tag
          --title "PayFlow v$VERSION"
          --notes-file "docs/releases/v$VERSION.md"
